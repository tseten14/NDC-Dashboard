<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NDC Data Explorer Uganda</title>
    <meta name="description" content="Uganda NDC data explorer — decision-support cockpit for climate delivery, MRV, and strategy alignment." />
    <meta name="author" content="Uganda NDC Data Explorer" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Space+Grotesk:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Space+Grotesk:wght@500;600;700&display=swap"
      />
    </noscript>
    <style>
      /* Initial-load splash — removed by main.tsx once React mounts */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        background: linear-gradient(135deg, hsl(168 38% 96%), hsl(152 32% 94%), hsl(202 38% 96%));
        transition: opacity 0.28s ease;
      }
      #splash.splash-done {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #10b981, #0d9488);
        box-shadow: 0 12px 40px -8px rgba(13, 148, 136, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #splash .splash-logo svg {
        width: 34px;
        height: 34px;
        stroke: #fff;
      }
      #splash .splash-bar {
        width: 120px;
        height: 3px;
        border-radius: 99px;
        overflow: hidden;
        background: rgba(13, 148, 136, 0.15);
        position: relative;
      }
      #splash .splash-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 99px;
        background: linear-gradient(90deg, #10b981, #0ea5e9);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      #splash .splash-label {
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(15, 60, 50, 0.55);
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 12px 40px -8px rgba(13, 148, 136, 0.45); }
        50% { transform: scale(1.06); box-shadow: 0 16px 52px -8px rgba(13, 148, 136, 0.6); }
      }
      @keyframes splash-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(290%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash { transition: none; }
        #splash .splash-logo, #splash .splash-bar::after { animation: none; }
      }
    </style>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="NDC Data Explorer Uganda" />
    <meta property="og:description" content="Uganda NDC data explorer — decision-support cockpit for climate delivery, MRV, and strategy alignment." />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NDC Data Explorer Uganda" />
    <meta name="twitter:description" content="Uganda NDC data explorer — decision-support cockpit for climate delivery, MRV, and strategy alignment." />
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
        </svg>
      </div>
      <div class="splash-bar"></div>
      <p class="splash-label">NDC Data Explorer</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
